<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" data-th-href="${faviconUrl}" sizes="32x32">
    <title>xpDoctor</title>

    <!-- reset css -->
    <link rel="stylesheet" data-th-href="${resetCssUrl}"/>


    <!-- app css -->
    <link rel="stylesheet" data-th-href="${mainCssUrl}"/>

    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- JQuery -->
    <script data-th-src="${jqueryUrl}"></script>

    <!-- Roboto -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">

    <script type="text/javascript" data-th-src="${renderJsonUrl}"></script>
    <script data-th-src="${mainJsUrl}"></script>

    <!-- DataTables -->
    <script data-th-src="${dataTablesJsUrl}"></script>
    <link rel="stylesheet" data-th-href="${dataTablesCssUrl}"></link>

    <script data-th-inline="javascript">
        /*<![CDATA[*/
        var validatorApiUrl = [[${validatorApiUrl}]];
        var progressApiUrl = [[${progressApiUrl}]];
        var stateApiUrl = [[${stateApiUrl}]];
        var lastResultApiUrl = [[${lastResultApiUrl}]];
        var wsUrl = [[${wsUrl}]];
        var repairApiUrl = [[${repairApiUrl}]];
        var repoListApiUrl = [[${repoListApiUrl}]];
        var cancelApiUrl = [[${cancelApiUrl}]];
        /*]]>*/
    </script>

</head>
<body>

<main>
    <nav class="navbar">

        <a class="navbar-brand" href="#"><img data-th-src="${logoUrl}"/></a>
    </nav>

    <div class="mainContainer">

        <div class="toolbar">
            <div class="toolbar-items">
                <div class="repos">
                    <select class="repoSelector" id="repoSelector" multiple>
                    </select>
                </div>
                <div class="actions">
                    <button id="btnRunValidator" type="button" class="big-action-button analyze" disabled>
                        <i class="material-icons">play_arrow</i>
                        <p class="buttonDescr">Analyse</p>
                    </button>
                    <button id="btnRepairAll" type="button" class="big-action-button repair" disabled>
                        <i class="material-icons">build</i>
                        <p class="buttonDescr">Repair all</p>
                    </button>
                </div>

                <div class="validators">
                    <div class="toggleAll">
                        <button id="toggleAll" class="toggleAllButton">
                            Toggle All
                        </button>
                    </div>
                    <div data-th-each="item,iterStat : ${validators}" class="validatorItems">
                        <div class="validatorItem" data-th-id="${'validator_' + item.name}">
                            <input
                                    class="form-check-input"
                                    type="checkbox"
                                    data-th-id="${'checkbox_' + item.name}"
                                    data-th-attr="data-validatorName=${item.name}"
                                    value=""
                                    checked>
                            <label
                                    class="form-check-label"
                                    data-th-attr="for=${'checkbox_' + item.name}">
                                <!-- This makes the label clickable -->
                                <span data-th-text="${item.name}"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>


    <!-- RESULT -->

    <div class="resultWrapper" id="resultWrapper">
        <div class="resultMessage" id="resultMessage">Select repositories and click the "Analyse" button</div>
        <div class="resultTab hidden" id="resultTab">
            <table id='resultTable' class='table'>
                <!--       <thead>
                       <th>repo</th>
                       <th>branch</th>
                       <th>type</th>
                       <th>id</th>
                       <th>nodeVersionId</th>
                       <th>path</th>
                       <th>message</th>
                       <th>repairStatus</th>
                       <th>repairMessage</th>
                       <th>Operations</th>
                       </thead>
                       <tbody id="issuesTableData">
                       </tbody>-->
            </table>
        </div>
    </div>

</main>

<div id="messageBox" class="row messageBox">
    <span id="repoMessage"></span>
</div>

<div id="analysisOverlay" class="overlay hidden">
    <div class="overlayDialog">
        <div id="overlayProgress">
            <p class="overlayRepo" id="overlayRepo"></p>
            <p class="overlayValidator" id="overlayValidator"></p>
            <div class="progressBar">
                <div class="progressBarFill" id="progressBarFill"></div>
            </div>
            <div class="overlayActions">
                <button id="btnCancel" type="button" class="overlayButton">Cancel</button>
            </div>
        </div>
        <div id="overlaySummary" class="hidden">
            <table class="summaryTable">
                <thead>
                <tr>
                    <th>Repository</th>
                    <th>Analysed</th>
                    <th>Invalid</th>
                    <th>Repairable</th>
                </tr>
                </thead>
                <tbody id="summaryTableBody">
                </tbody>
            </table>
            <div class="overlayActions">
                <button id="btnCloseOverlay" type="button" class="overlayButton">Close</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
