<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" data-th-href="${faviconUrl}" sizes="32x32">
    <title>xpDoctor</title>

    <!-- reset css -->
    <link rel="stylesheet" data-th-href="${resetCssUrl}"/>


    <!-- app css -->
    <link rel="stylesheet" data-th-href="${mainCssUrl}"/>

    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- JQuery -->
    <script data-th-src="${jqueryUrl}"></script>

    <!-- Roboto -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">

    <script type="text/javascript" data-th-src="${renderJsonUrl}"></script>
    <script data-th-src="${mainJsUrl}"></script>

    <!-- DataTables -->
    <script data-th-src="${dataTablesJsUrl}"></script>
    <link rel="stylesheet" data-th-href="${dataTablesCssUrl}"></link>

    <script data-th-inline="javascript">
        /*<![CDATA[*/
        var validatorApiUrl = [[${validatorApiUrl}]];
        var progressApiUrl = [[${progressApiUrl}]];
        var stateApiUrl = [[${stateApiUrl}]];
        var lastResultApiUrl = [[${lastResultApiUrl}]];
        var wsUrl = [[${wsUrl}]];
        var repairApiUrl = [[${repairApiUrl}]];
        var repoListApiUrl = [[${repoListApiUrl}]];
        var cancelApiUrl = [[${cancelApiUrl}]];
        /*]]>*/
    </script>

</head>
<body>

<script type="module" data-th-src="${menuLoaderUrl}"></script>

<main>
    <nav class="navbar">
        <a class="navbar-brand" href="#"><img data-th-src="${logoUrl}"/></a>
    </nav>

    <div class="content">

        <div class="resultWrapper hidden" id="resultWrapper">
            <div class="resultToolbar">
                <button id="btnNewAnalysis" type="button" class="toolbarButton">
                    <i class="material-icons">play_arrow</i>
                    <span>New analysis</span>
                </button>
                <button id="btnRepairAll" type="button" class="toolbarButton repair" disabled>
                    <i class="material-icons">build</i>
                    <span>Repair all</span>
                </button>
            </div>
            <div class="resultTab" id="resultTab">
                <table id='resultTable' class='table'>
                </table>
            </div>
        </div>

    </div>

</main>

<div id="messageBox" class="row messageBox">
    <span id="repoMessage"></span>
</div>

<div id="analysisOverlay" class="overlay hidden">
    <div class="overlayDialog">
        <div id="overlaySetup" class="hidden">
            <div class="setupColumns">
                <div class="setupColumn">
                    <h3>Repositories</h3>
                    <div class="treeList" id="repoTree"></div>
                </div>
                <div class="setupColumn">
                    <h3>Validators</h3>
                    <div class="validatorList" id="validatorList">
                        <label class="validatorItem selectAll">
                            <input type="checkbox" id="selectAllValidators" checked>
                            <span class="validatorTitle">Select all</span>
                        </label>
                        <label data-th-each="item : ${validators}" class="validatorItem">
                            <input type="checkbox" class="validatorCheckbox" data-th-attr="data-validatorName=${item.name}" checked>
                            <span class="validatorText">
                                <span class="validatorTitle" data-th-text="${item.title}"></span>
                                <span class="validatorDescription" data-th-text="${item.description}"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="overlayActions">
                <span class="selectionSummary" id="selectionSummary"></span>
                <button id="btnCloseSetup" type="button" class="overlayButton secondary">Cancel</button>
                <button id="btnAnalyse" type="button" class="overlayButton" disabled>Analyse</button>
            </div>
        </div>
        <div id="overlayProgress" class="hidden">
            <p class="overlayRepo" id="overlayRepo"></p>
            <p class="overlayValidator" id="overlayValidator"></p>
            <div class="progressBar">
                <div class="progressBarFill" id="progressBarFill"></div>
            </div>
            <div class="overlayActions">
                <button id="btnCancel" type="button" class="overlayButton">Cancel</button>
            </div>
        </div>
        <div id="overlaySummary" class="hidden">
            <table class="summaryTable">
                <thead>
                <tr>
                    <th>Repository</th>
                    <th>Analysed</th>
                    <th>Invalid</th>
                    <th>Repairable</th>
                </tr>
                </thead>
                <tbody id="summaryTableBody">
                </tbody>
            </table>
            <div class="overlayActions">
                <button id="btnCloseOverlay" type="button" class="overlayButton">Close</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
